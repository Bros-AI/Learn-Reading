<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Learn Reading - Apprenons à Lire!</title>
    <meta name="description" content="Application interactive d'apprentissage de la lecture avec reconnaissance vocale">
    
    <!-- PWA Meta -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* Modern CSS Reset & Variables */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --vh: 1vh;
            --dvh: 1dvh;
            
            /* Colors */
            --primary-hue: 233;
            --primary: hsl(233, 70%, 65%);
            --primary-dark: hsl(233, 70%, 55%);
            --primary-light: hsl(233, 70%, 75%);
            
            --success: hsl(145, 60%, 45%);
            --warning: hsl(35, 85%, 60%);
            --error: hsl(0, 80%, 65%);
            --info: hsl(200, 80%, 60%);
            
            --surface-primary: #ffffff;
            --surface-secondary: #f7fafc;
            --surface-tertiary: #edf2f7;
            --surface-glass: hsla(0, 0%, 100%, 0.85);
            
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --text-inverse: #ffffff;
            
            /* Spacing - Compact for mobile */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 0.75rem;
            --space-lg: 1rem;
            --space-xl: 1.25rem;
            
            /* Typography - Mobile optimized */
            --font-system: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            
            /* Shadows & Effects */
            --shadow-sm: 0 1px 2px hsla(0, 0%, 0%, 0.05);
            --shadow-md: 0 4px 6px hsla(0, 0%, 0%, 0.1);
            --shadow-lg: 0 10px 15px hsla(0, 0%, 0%, 0.1);
            --shadow-glow: 0 0 20px hsla(233, 70%, 65%, 0.3);
            
            /* Border Radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
            
            /* Transitions */
            --duration-fast: 150ms;
            --duration-base: 200ms;
            
            /* Safe Areas */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface-primary: #1a202c;
                --surface-secondary: #2d3748;
                --surface-tertiary: #4a5568;
                --surface-glass: hsla(220, 30%, 15%, 0.85);
                --text-primary: #f7fafc;
                --text-secondary: #e2e8f0;
                --text-muted: #a0aec0;
            }
        }

        /* Base Styles */
        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            height: 100%;
            height: 100dvh;
        }

        body {
            font-family: var(--font-system);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text-primary);
            line-height: 1.5;
            height: 100%;
            height: 100dvh;
            overflow: hidden; /* Prevent any scrolling */
            position: relative;
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.3;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, hsl(233, 80%, 70%) 0%, transparent 70%);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, hsl(35, 80%, 70%) 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        /* Main Container - Full height, no scroll */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 100vw;
            margin: 0 auto;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
            overflow: hidden;
        }

        /* Header - Compact */
        .app-header {
            flex-shrink: 0;
            background-color: var(--surface-glass);
            backdrop-filter: blur(10px);
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid hsla(0, 0%, 50%, 0.1);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: var(--text-lg);
            font-weight: 800;
            color: var(--text-primary);
        }

        .title-icon {
            font-size: var(--text-xl);
        }

        .title-text {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            background-color: var(--surface-secondary);
            border-radius: var(--radius-full);
            padding: 2px;
            border: 1px solid var(--surface-tertiary);
        }

        .mode-btn {
            padding: var(--space-xs) var(--space-sm);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: var(--text-xs);
            font-weight: 600;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--duration-fast);
        }

        .mode-btn.active {
            background-color: var(--primary);
            color: var(--text-inverse);
            box-shadow: var(--shadow-sm);
        }

        /* Stats Bar - Compact */
        .stats-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
            background-color: var(--surface-glass);
            backdrop-filter: blur(10px);
            margin: var(--space-sm);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-icon { 
            font-size: var(--text-sm); 
            color: var(--primary); 
        }

        .stat-value { 
            font-size: var(--text-xs); 
            font-weight: 700; 
            color: var(--text-primary); 
        }

        /* Game Area - Flexible height */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: var(--space-sm) var(--space-md);
            overflow: hidden;
            min-height: 0; /* Important for flex child */
        }

        /* Word Management - Collapsible */
        .word-management {
            flex-shrink: 0;
            background-color: var(--surface-glass);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-sm);
            overflow: hidden;
            transition: all var(--duration-base);
        }

        .word-management.collapsed {
            max-height: 0;
            margin-bottom: 0;
            opacity: 0;
        }

        .word-management-content {
            padding: var(--space-md);
        }

        .word-management h3 {
            font-size: var(--text-sm);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
            text-align: center;
        }

        .add-word-form {
            display: flex;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
        }

        .add-word-form input {
            flex: 1;
            padding: var(--space-sm);
            border: 1px solid var(--surface-tertiary);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            background-color: var(--surface-primary);
            color: var(--text-primary);
        }

        .add-word-form button {
            padding: var(--space-sm) var(--space-md);
            background-color: var(--primary);
            color: var(--text-inverse);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 600;
        }

        .custom-words {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            justify-content: center;
            max-height: 60px;
            overflow-y: auto;
        }

        .custom-word-tag {
            background-color: var(--surface-secondary);
            color: var(--text-primary);
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .remove-word {
            background-color: var(--error);
            color: var(--text-inverse);
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Word Card - Main content area */
        .word-card {
            flex: 1;
            background-color: var(--surface-glass);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-xl);
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            min-height: 0;
        }

        .level-info {
            flex-shrink: 0;
            text-align: center;
            margin-bottom: var(--space-md);
        }

        .level-text {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--primary);
            margin-bottom: var(--space-xs);
        }

        .progress-container {
            width: 200px;
            height: 4px;
            background-color: var(--surface-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-light) 0%, var(--primary) 100%);
            border-radius: var(--radius-full);
            transition: width var(--duration-base);
            width: 0%;
        }

        .word-container {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
            min-height: 80px;
        }

        .syllable {
            font-size: clamp(24px, 6vw, 36px);
            padding: var(--space-sm) var(--space-md);
            background-color: var(--surface-primary);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--duration-base);
            user-select: none;
            border: 2px solid transparent;
            min-width: 50px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .full-word {
            font-size: clamp(18px, 4vw, 28px);
            padding: var(--space-md) var(--space-lg);
            background-color: var(--surface-primary);
            border-radius: var(--radius-xl);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--duration-base);
            user-select: none;
            border: 2px solid transparent;
            text-align: center;
            box-shadow: var(--shadow-sm);
            max-width: 100%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .syllable:hover, .full-word:hover {
            background-color: var(--primary-light);
            color: var(--text-inverse);
            transform: scale(1.05);
        }

        .syllable.active, .full-word.active {
            background-color: var(--primary);
            color: var(--text-inverse);
            transform: scale(1.1);
            border-color: var(--primary-dark);
        }

        .syllable.correct, .full-word.correct {
            background-color: var(--success);
            color: var(--text-inverse);
            animation: correct-bounce 0.6s ease;
        }

        /* Voice Input Area - Compact */
        .voice-input-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
            min-height: 0;
        }

        .oscilloscope-container {
            width: 100%;
            max-width: 300px;
            height: 80px;
            background-color: var(--surface-secondary);
            border-radius: var(--radius-lg);
            border: 2px solid var(--primary);
            overflow: hidden;
            position: relative;
        }

        .oscilloscope-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .voice-button {
            width: clamp(80px, 20vw, 120px);
            height: clamp(80px, 20vw, 120px);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            color: var(--text-inverse);
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all var(--duration-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        .voice-button:active {
            transform: scale(0.95);
        }

        .voice-button.listening {
            animation: pulse-ring 1.5s infinite ease-out;
            background: linear-gradient(135deg, var(--warning) 0%, hsl(35, 85%, 50%) 100%);
        }

        .voice-button.processing {
            background: linear-gradient(135deg, var(--info) 0%, hsl(200, 80%, 50%) 100%);
            animation: spin 1s linear infinite;
        }

        .mic-icon {
            font-size: clamp(24px, 6vw, 32px);
            position: relative;
            z-index: 2;
        }

        .voice-wave {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .voice-wave span {
            width: 3px;
            background-color: var(--text-inverse);
            border-radius: var(--radius-full);
            animation: wave 1.2s ease-in-out infinite;
        }

        .voice-wave span:nth-child(1) { animation-delay: 0s; }
        .voice-wave span:nth-child(2) { animation-delay: 0.15s; }
        .voice-wave span:nth-child(3) { animation-delay: 0.3s; }
        .voice-wave span:nth-child(4) { animation-delay: 0.45s; }
        .voice-wave span:nth-child(5) { animation-delay: 0.6s; }

        .voice-status {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
        }

        .voice-status.listening {
            color: var(--warning);
        }

        .voice-status.processing {
            color: var(--info);
        }

        /* Bottom Controls - Fixed height */
        .bottom-controls {
            flex-shrink: 0;
            padding: var(--space-md);
            background: linear-gradient(to top, var(--surface-secondary) 70%, transparent 100%);
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
        }

        .control-btn {
            padding: var(--space-sm) var(--space-md);
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-fast);
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .control-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text-inverse);
            box-shadow: var(--shadow-md);
        }

        .control-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .control-btn.secondary {
            background-color: var(--surface-primary);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .control-btn.secondary:hover {
            background-color: var(--surface-tertiary);
        }

        /* Feedback Display */
        .feedback-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background-color: var(--surface-primary);
            padding: var(--space-lg);
            border-radius: var(--radius-xl);
            text-align: center;
            font-size: var(--text-base);
            font-weight: 600;
            opacity: 0;
            transition: all var(--duration-base);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            max-width: 90vw;
            pointer-events: none;
        }

        .feedback-display.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-display.success {
            background-color: var(--success);
            color: var(--text-inverse);
        }

        .feedback-display.error {
            background-color: var(--error);
            color: var(--text-inverse);
        }

        .feedback-display.info {
            background-color: var(--info);
            color: var(--text-inverse);
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            opacity: 0.9;
            animation: confetti-fall 3s linear forwards;
        }

        .confetti:nth-child(2n) { 
            background-color: var(--success); 
            border-radius: 50%; 
        }
        
        .confetti:nth-child(3n) { 
            background-color: var(--warning); 
        }
        
        .confetti:nth-child(4n) { 
            background-color: var(--info); 
            width: 4px; 
            height: 12px;
        }
        
        .confetti:nth-child(5n) { 
            background-color: var(--error); 
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(15px, -15px) scale(1.02); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes pulse-ring {
            0% { 
                box-shadow: var(--shadow-lg), 0 0 0 0 hsla(35, 85%, 60%, 0.7); 
            }
            70% { 
                box-shadow: var(--shadow-lg), 0 0 0 15px hsla(35, 85%, 60%, 0); 
            }
            100% { 
                box-shadow: var(--shadow-lg), 0 0 0 0 hsla(35, 85%, 60%, 0); 
            }
        }

        @keyframes wave {
            0%, 100% { height: 8px; opacity: 0.5; }
            50% { height: 24px; opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes correct-bounce {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.1); }
            60% { transform: scale(0.95); }
        }

        @keyframes confetti-fall {
            0% { 
                transform: translateY(-10vh) translateX(0) rotate(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: translateY(110vh) translateX(30vw) rotate(360deg); 
                opacity: 0; 
            }
        }

        /* Mobile specific optimizations */
        @media (max-width: 480px) {
            .control-buttons {
                flex-direction: column;
                gap: var(--space-sm);
            }

            .control-btn {
                width: 100%;
                justify-content: center;
            }

            .stats-bar {
                padding: var(--space-xs) var(--space-sm);
                margin: var(--space-xs);
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .word-card {
                padding: var(--space-md);
            }

            .voice-button {
                width: 60px;
                height: 60px;
            }

            .oscilloscope-container {
                height: 60px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .gradient-orb {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>
    
    <!-- Confetti Container -->
    <div id="confetti-container" class="confetti-container"></div>
    
    <!-- Main App Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-icon">📚</span>
                    <span class="title-text">Learn Reading</span>
                </h1>
                
                <!-- Mode Toggle -->
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="levels" onclick="app.switchMode('levels')">
                        Niveaux
                    </button>
                    <button class="mode-btn" data-mode="custom" onclick="app.switchMode('custom')">
                        Mes Mots
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="stats-bar">
            <div class="stat-item">
                <span class="stat-icon">🏆</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🔥</span>
                <span id="streak" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🎯</span>
                <span id="accuracy" class="stat-value">100%</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">⏱️</span>
                <span id="timer" class="stat-value">0:00</span>
            </div>
        </section>

        <!-- Game Area -->
        <section class="game-area">
            <!-- Word Management (Custom Mode) -->
            <div class="word-management collapsed" id="wordManagement">
                <div class="word-management-content">
                    <h3>➕ Ajouter mots ou phrases</h3>
                    <div class="add-word-form">
                        <input type="text" id="newWord" placeholder="Mot ou phrase..." maxlength="100">
                        <button onclick="app.addCustomWord()">Ajouter</button>
                    </div>
                    <div class="custom-words" id="customWords"></div>
                </div>
            </div>

            <!-- Word Card -->
            <div class="word-card">
                <!-- Level Info (Levels Mode) -->
                <div class="level-info" id="levelInfo">
                    <div class="level-text">Niveau: <span id="level">1</span></div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <!-- Word Display -->
                <div id="wordDisplay" class="word-container">
                    <div class="syllable">Tap</div>
                    <div class="syllable">Start</div>
                </div>
                
                <!-- Voice Input Area -->
                <div class="voice-input-area">
                    <div class="oscilloscope-container">
                        <canvas id="oscilloscope" class="oscilloscope-canvas" width="300" height="80"></canvas>
                    </div>
                    
                    <button class="voice-button" id="voiceButton">
                        <span class="mic-icon">🎤</span>
                        <div class="voice-wave hidden" id="voiceWave">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                    </button>
                    
                    <div class="voice-status" id="voiceStatus">
                        Maintenez pour parler
                    </div>
                </div>
            </div>
        </section>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            <div class="control-buttons">
                <button class="control-btn secondary" onclick="app.speakCurrentWord()">
                    🔊 Écouter
                </button>
                <button class="control-btn primary" onclick="app.nextWord()">
                    ▶️ Suivant
                </button>
                <button class="control-btn secondary" onclick="app.resetProgress()">
                    🔄 Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Feedback Display -->
    <div id="feedback" class="feedback-display"></div>

    <script>
        class FrenchLearningApp {
            constructor() {
                this.CONFIG = {
                    CONFETTI_COUNT: 30,
                    FEEDBACK_DURATION: 2000,
                    SPEECH_RATE: 0.8,
                    LONG_PRESS_DURATION: 100,
                    TAP_THRESHOLD: 15,
                };

                this.defaultLevels = {
                    1: [
                        { word: "papa", syllables: ["pa", "pa"], alternates: ["papa", "papa!", "le papa", "mon papa"] },
                        { word: "maman", syllables: ["ma", "man"], alternates: ["maman", "maman!", "la maman", "ma maman"] },
                        { word: "bébé", syllables: ["bé", "bé"], alternates: ["bébé", "bébé!", "le bébé", "un bébé"] }
                    ],
                    2: [
                        { word: "maison", syllables: ["mai", "son"], alternates: ["maison", "la maison", "une maison", "ma maison"] },
                        { word: "voiture", syllables: ["voi", "ture"], alternates: ["voiture", "la voiture", "une voiture", "ma voiture"] },
                        { word: "jardin", syllables: ["jar", "din"], alternates: ["jardin", "le jardin", "un jardin", "mon jardin"] }
                    ],
                    3: [
                        { word: "papillon", syllables: ["pa", "pi", "llon"], alternates: ["papillon", "le papillon", "un papillon"] },
                        { word: "chocolat", syllables: ["cho", "co", "lat"], alternates: ["chocolat", "le chocolat", "du chocolat"] },
                        { word: "éléphant", syllables: ["é", "lé", "phant"], alternates: ["éléphant", "l'éléphant", "un éléphant"] }
                    ]
                };

                this.initializeApp();
            }

            async initializeApp() {
                this.initializeElements();
                this.initializeState();
                await this.loadSavedData();
                await this.initializeSpeechSystems();
                this.setupEventListeners();
                this.setupOscilloscope();
                this.initializeUI();
                console.log('French Learning App Initialized Successfully');
            }

            initializeElements() {
                this.elements = {
                    score: document.getElementById('score'),
                    streak: document.getElementById('streak'),
                    accuracy: document.getElementById('accuracy'),
                    timer: document.getElementById('timer'),
                    level: document.getElementById('level'),
                    levelInfo: document.getElementById('levelInfo'),
                    progressBar: document.getElementById('progressBar'),
                    wordDisplay: document.getElementById('wordDisplay'),
                    voiceButton: document.getElementById('voiceButton'),
                    voiceWave: document.getElementById('voiceWave'),
                    voiceStatus: document.getElementById('voiceStatus'),
                    feedback: document.getElementById('feedback'),
                    newWord: document.getElementById('newWord'),
                    customWords: document.getElementById('customWords'),
                    wordManagement: document.getElementById('wordManagement'),
                    confettiContainer: document.getElementById('confetti-container'),
                    oscilloscope: document.getElementById('oscilloscope')
                };

                this.oscilloscope = {
                    canvas: this.elements.oscilloscope,
                    ctx: this.elements.oscilloscope.getContext('2d'),
                    animationId: null
                };
            }

            initializeState() {
                this.state = {
                    mode: 'levels', // 'levels' or 'custom'
                    currentLevel: 1,
                    currentIndex: 0,
                    score: 0,
                    streak: 0,
                    bestStreak: 0,
                    totalQuestions: 0,
                    correctAnswers: 0,
                    sessionQuestions: 0,
                    voiceUsageCount: 0,
                    isListening: false,
                    isProcessing: false,
                    sessionStartTime: null,
                    problemStartTime: null
                };

                this.recognitionState = 'stopped';
                this.levels = JSON.parse(JSON.stringify(this.defaultLevels));
                this.customWords = JSON.parse(localStorage.getItem('frenchApp_customWords') || '[]');
                this.timers = { session: null, feedback: null };
            }

            async loadSavedData() {
                const savedStats = localStorage.getItem('frenchApp_stats');
                if (savedStats) {
                    const stats = JSON.parse(savedStats);
                    this.state.bestStreak = stats.bestStreak || 0;
                }
            }

            async initializeSpeechSystems() {
                this.synth = window.speechSynthesis;
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.setupSpeechRecognition();
                } else {
                    console.warn('Speech recognition not supported');
                    this.elements.voiceButton.disabled = true;
                    this.elements.voiceStatus.textContent = 'Reconnaissance vocale non supportée';
                }
            }

            setupSpeechRecognition() {
                this.recognition.lang = 'fr-FR';
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                this.recognition.maxAlternatives = 5;

                this.recognition.onstart = () => {
                    console.log('Recognition started');
                    this.recognitionState = 'running';
                    this.state.isListening = true;
                    this.elements.voiceButton.classList.add('listening');
                    this.elements.voiceWave.classList.remove('hidden');
                    this.elements.voiceStatus.textContent = "J'écoute...";
                    this.elements.voiceStatus.classList.add('listening');
                    this.startOscilloscope();
                };

                this.recognition.onresult = (event) => {
                    console.log('Recognition result received', event.results);
                    
                    // Get all alternatives from the final result
                    const alternatives = [];
                    const result = event.results[event.results.length - 1];
                    
                    if (result.isFinal) {
                        for (let i = 0; i < result.length; i++) {
                            alternatives.push({
                                transcript: result[i].transcript.toLowerCase().trim(),
                                confidence: result[i].confidence || 0.5
                            });
                        }
                        
                        console.log('Final alternatives:', alternatives);
                        if (alternatives.length > 0) {
                            this.processVoiceResult(alternatives);
                        } else {
                            console.log('No alternatives found');
                            this.showFeedback("Aucune parole détectée", 'info');
                        }
                    }
                };

                this.recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error, event.message);
                    this.recognitionState = 'stopped';
                    
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        this.showFeedback("Accès au microphone refusé", 'error');
                    } else if (event.error === 'no-speech') {
                        this.showFeedback("Aucune parole détectée", 'info');
                    } else if (event.error === 'network') {
                        this.showFeedback("Erreur réseau", 'error');
                    } else {
                        this.showFeedback("Erreur de reconnaissance", 'error');
                    }
                    
                    this.stopListening();
                };

                this.recognition.onend = () => {
                    console.log('Recognition ended');
                    this.recognitionState = 'stopped';
                    if (this.state.isListening) {
                        this.stopListening();
                    }
                };
            }

            setupEventListeners() {
                this.setupVoiceButtonListeners();
                
                this.elements.newWord.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.addCustomWord();
                    }
                });

                document.addEventListener('keydown', (e) => this.handleKeyboardShortcuts(e));
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.state.isListening) {
                        this.stopListening();
                    }
                });
            }

            setupVoiceButtonListeners() {
                let pressTimer = null;
                let startX = 0, startY = 0;
                let movedTooFar = false;

                const onStart = (e) => {
                    if (this.state.isListening || this.state.isProcessing || !this.recognition) return;
                    e.preventDefault();
                    movedTooFar = false;
                    
                    if (e.type.startsWith('touch')) {
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                    }
                    
                    pressTimer = setTimeout(() => {
                        if (!movedTooFar) this.startListening();
                    }, this.CONFIG.LONG_PRESS_DURATION);
                };

                const onEnd = (e) => {
                    if (!this.recognition) return;
                    if (pressTimer) clearTimeout(pressTimer);
                    pressTimer = null;
                    if (this.state.isListening) this.stopListening();
                };

                const onMove = (e) => {
                    if (!pressTimer || movedTooFar || !e.type.startsWith('touch')) return;
                    const touch = e.touches[0];
                    const deltaX = Math.abs(touch.clientX - startX);
                    const deltaY = Math.abs(touch.clientY - startY);
                    if (deltaX > this.CONFIG.TAP_THRESHOLD || deltaY > this.CONFIG.TAP_THRESHOLD) {
                        movedTooFar = true;
                        if (pressTimer) clearTimeout(pressTimer);
                        pressTimer = null;
                        if (this.state.isListening) this.stopListening();
                    }
                };

                this.elements.voiceButton.addEventListener('mousedown', onStart);
                this.elements.voiceButton.addEventListener('mouseup', onEnd);
                this.elements.voiceButton.addEventListener('mouseleave', onEnd);
                this.elements.voiceButton.addEventListener('touchstart', onStart, { passive: false });
                this.elements.voiceButton.addEventListener('touchend', onEnd, { passive: false });
                this.elements.voiceButton.addEventListener('touchcancel', onEnd, { passive: false });
                this.elements.voiceButton.addEventListener('touchmove', onMove, { passive: false });
            }

            setupOscilloscope() {
                const canvas = this.oscilloscope.canvas;
                const ctx = this.oscilloscope.ctx;
                
                canvas.width = canvas.offsetWidth * (window.devicePixelRatio || 1);
                canvas.height = canvas.offsetHeight * (window.devicePixelRatio || 1);
                ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
                
                this.drawOscilloscopeGrid();
            }

            drawOscilloscopeGrid() {
                const ctx = this.oscilloscope.ctx;
                const canvas = this.oscilloscope.canvas;
                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;
                
                ctx.clearRect(0, 0, width, height);
                
                // Draw grid
                ctx.strokeStyle = 'hsla(233, 50%, 50%, 0.2)';
                ctx.lineWidth = 0.5;
                
                // Vertical lines
                for (let x = 0; x <= width; x += 15) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }
                
                // Horizontal lines
                for (let y = 0; y <= height; y += 15) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }
                
                // Center line
                ctx.strokeStyle = 'hsla(233, 70%, 65%, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.stroke();
            }

            startOscilloscope() {
                if (!this.audioContext) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            this.analyser = this.audioContext.createAnalyser();
                            this.analyser.fftSize = 2048;
                            
                            const source = this.audioContext.createMediaStreamSource(stream);
                            source.connect(this.analyser);
                            
                            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                            this.drawOscilloscope();
                        })
                        .catch(err => {
                            console.error('Microphone access error:', err);
                        });
                } else {
                    this.drawOscilloscope();
                }
            }

            drawOscilloscope() {
                if (!this.state.isListening || !this.analyser) {
                    this.drawOscilloscopeGrid();
                    return;
                }

                const ctx = this.oscilloscope.ctx;
                const canvas = this.oscilloscope.canvas;
                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;
                
                this.analyser.getByteTimeDomainData(this.dataArray);
                this.drawOscilloscopeGrid();
                
                // Draw waveform
                ctx.strokeStyle = '#667eea';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                const sliceWidth = width / this.dataArray.length;
                let x = 0;
                
                for (let i = 0; i < this.dataArray.length; i++) {
                    const v = this.dataArray[i] / 128.0;
                    const y = (v * height) / 2;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                ctx.stroke();
                
                // Add glow effect
                const amplitude = this.getAudioAmplitude();
                if (amplitude > 0.1) {
                    ctx.shadowColor = '#667eea';
                    ctx.shadowBlur = 8;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                
                if (this.state.isListening) {
                    this.oscilloscope.animationId = requestAnimationFrame(() => this.drawOscilloscope());
                }
            }

            getAudioAmplitude() {
                if (!this.dataArray) return 0;
                
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) {
                    const amplitude = Math.abs(this.dataArray[i] - 128) / 128;
                    sum += amplitude;
                }
                return sum / this.dataArray.length;
            }

            stopOscilloscope() {
                if (this.oscilloscope.animationId) {
                    cancelAnimationFrame(this.oscilloscope.animationId);
                    this.oscilloscope.animationId = null;
                }
                this.drawOscilloscopeGrid();
            }

            initializeUI() {
                this.addCustomWordsToLevels();
                this.displayCustomWords();
                this.updateStats();
                this.updateProgress();
                this.displayCurrentWord();
                this.startSessionTimer();
            }

            switchMode(mode) {
                this.state.mode = mode;
                
                // Update mode buttons
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.mode === mode) {
                        btn.classList.add('active');
                    }
                });

                // Show/hide appropriate sections
                if (mode === 'custom') {
                    this.elements.wordManagement.classList.remove('collapsed');
                    this.elements.levelInfo.style.display = 'none';
                    this.state.currentIndex = 0;
                } else {
                    this.elements.wordManagement.classList.add('collapsed');
                    this.elements.levelInfo.style.display = 'block';
                    this.state.currentLevel = 1;
                    this.state.currentIndex = 0;
                }

                this.updateProgress();
                this.displayCurrentWord();
            }

            addCustomWordsToLevels() {
                if (this.customWords.length > 0) {
                    this.levels[4] = [...this.customWords];
                } else {
                    delete this.levels[4];
                }
            }

            displayCustomWords() {
                const container = this.elements.customWords;
                container.innerHTML = '';
                
                this.customWords.forEach((wordObj, index) => {
                    const tag = document.createElement('div');
                    tag.className = 'custom-word-tag';
                    tag.innerHTML = `
                        <span>${wordObj.word}</span>
                        <button class="remove-word" onclick="app.removeCustomWord(${index})">×</button>
                    `;
                    container.appendChild(tag);
                });
            }

            displayCurrentWord() {
                const wordDisplay = this.elements.wordDisplay;
                wordDisplay.innerHTML = '';
                
                const currentWord = this.getCurrentWord();
                if (currentWord) {
                    if (this.state.mode === 'custom') {
                        // Custom mode: Show full word/sentence without syllable breakdown
                        const wordElement = document.createElement('div');
                        wordElement.className = 'full-word';
                        wordElement.textContent = currentWord.word;
                        wordElement.onclick = () => this.speakCurrentWord();
                        wordDisplay.appendChild(wordElement);
                    } else {
                        // Levels mode: Show syllables
                        currentWord.syllables.forEach((syllable) => {
                            const syllableElement = document.createElement('div');
                            syllableElement.className = 'syllable';
                            syllableElement.textContent = syllable;
                            syllableElement.onclick = () => this.speakSyllable(syllable);
                            wordDisplay.appendChild(syllableElement);
                        });
                    }
                    
                    this.state.problemStartTime = Date.now();
                } else {
                    // No more words
                    if (this.state.mode === 'custom') {
                        wordDisplay.innerHTML = '<div class="syllable">Ajoutez des mots!</div>';
                    } else {
                        wordDisplay.innerHTML = '<div class="syllable">Appuyez Start!</div>';
                    }
                }
            }

            getCurrentWord() {
                if (this.state.mode === 'custom') {
                    return this.customWords[this.state.currentIndex];
                } else {
                    return this.levels[this.state.currentLevel]?.[this.state.currentIndex];
                }
            }

            speakSyllable(syllable) {
                if (!this.synth) return;
                
                const utterance = new SpeechSynthesisUtterance(syllable);
                utterance.lang = 'fr-FR';
                utterance.rate = this.CONFIG.SPEECH_RATE;
                this.synth.speak(utterance);

                // Visual feedback
                const syllables = document.querySelectorAll('.syllable');
                syllables.forEach(el => {
                    if (el.textContent === syllable) {
                        el.classList.add('active');
                        setTimeout(() => el.classList.remove('active'), 300);
                    }
                });
            }

            speakCurrentWord() {
                const currentWord = this.getCurrentWord();
                if (!currentWord || !this.synth) return;
                
                const utterance = new SpeechSynthesisUtterance(currentWord.word);
                utterance.lang = 'fr-FR';
                utterance.rate = this.CONFIG.SPEECH_RATE;
                this.synth.speak(utterance);
            }

            addCustomWord() {
                const input = this.elements.newWord;
                const text = input.value.trim();
                
                if (text && text.length >= 2) {
                    // For custom words, we don't break into syllables - treat as full word/sentence
                    const newWord = {
                        word: text,
                        syllables: [text], // Store the full text as a single "syllable" for compatibility
                        alternates: [
                            text,
                            text.toLowerCase(),
                            text.charAt(0).toUpperCase() + text.slice(1).toLowerCase(),
                            `le ${text.toLowerCase()}`,
                            `la ${text.toLowerCase()}`,
                            `un ${text.toLowerCase()}`,
                            `une ${text.toLowerCase()}`,
                            `mon ${text.toLowerCase()}`,
                            `ma ${text.toLowerCase()}`,
                            `je ${text.toLowerCase()}`,
                            `tu ${text.toLowerCase()}`,
                            `il ${text.toLowerCase()}`,
                            `elle ${text.toLowerCase()}`
                        ]
                    };
                    
                    this.customWords.push(newWord);
                    localStorage.setItem('frenchApp_customWords', JSON.stringify(this.customWords));
                    input.value = '';
                    
                    this.addCustomWordsToLevels();
                    this.displayCustomWords();
                    
                    if (this.state.mode === 'custom') {
                        this.displayCurrentWord();
                    }
                    
                    this.showFeedback(`✅ "${text}" ajouté!`, 'success');
                }
            }

            removeCustomWord(index) {
                this.customWords.splice(index, 1);
                localStorage.setItem('frenchApp_customWords', JSON.stringify(this.customWords));
                this.addCustomWordsToLevels();
                this.displayCustomWords();
                
                if (this.state.mode === 'custom') {
                    if (this.state.currentIndex >= this.customWords.length) {
                        this.state.currentIndex = Math.max(0, this.customWords.length - 1);
                    }
                    this.displayCurrentWord();
                }
            }

            splitIntoSyllables(word) {
                const vowels = 'aeiouyàáâäèéêëìíîïòóôöùúûü';
                let syllables = [];
                let currentSyllable = '';
                
                for (let i = 0; i < word.length; i++) {
                    currentSyllable += word[i];
                    
                    if (vowels.includes(word[i].toLowerCase())) {
                        if (i < word.length - 1) {
                            const nextChar = word[i + 1];
                            if (!vowels.includes(nextChar.toLowerCase())) {
                                if (i < word.length - 2 && vowels.includes(word[i + 2].toLowerCase())) {
                                    currentSyllable += nextChar;
                                    i++;
                                }
                            }
                        }
                        syllables.push(currentSyllable);
                        currentSyllable = '';
                    }
                }
                
                if (currentSyllable) {
                    if (syllables.length > 0) {
                        syllables[syllables.length - 1] += currentSyllable;
                    } else {
                        syllables.push(currentSyllable);
                    }
                }
                
                return syllables.length > 0 ? syllables : [word];
            }

            startListening() {
                if (!this.recognition || this.state.isListening || this.state.isProcessing) {
                    console.log('❌ Cannot start listening:', {
                        hasRecognition: !!this.recognition,
                        isListening: this.state.isListening,
                        isProcessing: this.state.isProcessing,
                        recognitionState: this.recognitionState
                    });
                    return;
                }
                
                try {
                    // Force clean state
                    if (this.recognitionState === 'running') {
                        console.log('⚠️ Recognition already running, aborting first');
                        this.recognition.abort();
                        this.recognitionState = 'stopped';
                        setTimeout(() => this.startListening(), 200);
                        return;
                    }
                    
                    console.log('🎤 Starting voice recognition...');
                    this.recognitionState = 'starting';
                    this.recognition.start();
                    this.state.voiceUsageCount++;
                    
                    // Safety timeout - if recognition doesn't start in 3 seconds, reset
                    setTimeout(() => {
                        if (this.recognitionState === 'starting') {
                            console.log('⚠️ Recognition start timeout, resetting');
                            this.stopListening();
                        }
                    }, 3000);
                    
                } catch (error) {
                    console.error('❌ Recognition start error:', error);
                    this.recognitionState = 'stopped';
                    
                    if (error.name === 'InvalidStateError') {
                        console.log('🔄 Retrying after InvalidStateError');
                        try {
                            this.recognition.abort();
                            setTimeout(() => this.startListening(), 300);
                        } catch (abortError) {
                            console.error('❌ Recognition abort error:', abortError);
                            this.showFeedback('Erreur de reconnaissance vocale', 'error');
                        }
                    } else {
                        this.showFeedback('Impossible de démarrer la reconnaissance vocale', 'error');
                    }
                }
            }

            stopListening() {
                console.log('🛑 Stopping voice recognition...');
                
                this.state.isListening = false;
                this.state.isProcessing = false;
                this.elements.voiceButton.classList.remove('listening', 'processing');
                this.elements.voiceWave.classList.add('hidden');
                this.elements.voiceStatus.textContent = 'Maintenez pour parler';
                this.elements.voiceStatus.classList.remove('listening', 'processing');
                this.stopOscilloscope();
                
                if (this.recognition && this.recognitionState !== 'stopped') {
                    try {
                        this.recognitionState = 'stopping';
                        this.recognition.stop();
                        
                        // Force stop after 1 second if it doesn't stop gracefully
                        setTimeout(() => {
                            if (this.recognitionState === 'stopping') {
                                console.log('⚠️ Force stopping recognition');
                                try {
                                    this.recognition.abort();
                                } catch (e) {
                                    console.error('❌ Force abort error:', e);
                                }
                                this.recognitionState = 'stopped';
                            }
                        }, 1000);
                        
                    } catch (error) {
                        console.error('❌ Recognition stop error:', error);
                        try {
                            this.recognition.abort();
                        } catch (abortError) {
                            console.error('❌ Recognition abort error:', abortError);
                        }
                        this.recognitionState = 'stopped';
                    }
                }
            }

            processVoiceResult(alternatives) {
                const currentWord = this.getCurrentWord();
                if (!currentWord) {
                    console.log('No current word available');
                    return;
                }
                
                console.log('🎯 Processing voice result for word:', currentWord.word);
                console.log('📝 Expected alternates:', currentWord.alternates);
                console.log('🎤 Heard alternatives:', alternatives);
                
                let bestMatch = false;
                let bestScore = 0;
                let matchDetails = '';
                
                // Check each spoken alternative against each expected alternate
                for (const spokenAlt of alternatives) {
                    const normalizedSpoken = this.normalizeString(spokenAlt.transcript);
                    console.log('🔍 Checking spoken:', `"${normalizedSpoken}"`, 'confidence:', spokenAlt.confidence);
                    
                    for (const expectedAlt of currentWord.alternates) {
                        const normalizedExpected = this.normalizeString(expectedAlt);
                        console.log('  vs expected:', `"${normalizedExpected}"`);
                        
                        // 1. Exact match (highest priority)
                        if (normalizedSpoken === normalizedExpected) {
                            console.log('✅ EXACT MATCH FOUND!');
                            bestMatch = true;
                            bestScore = 1.0;
                            matchDetails = `Exact match: "${normalizedSpoken}" = "${normalizedExpected}"`;
                            break;
                        }
                        
                        // 2. Word contains the expected word (common case)
                        if (normalizedSpoken.includes(normalizedExpected)) {
                            console.log('✅ CONTAINS MATCH FOUND!');
                            bestMatch = true;
                            bestScore = Math.max(bestScore, 0.95);
                            matchDetails = `Contains match: "${normalizedSpoken}" contains "${normalizedExpected}"`;
                        }
                        
                        // 3. Expected contains the spoken word (also valid)
                        if (normalizedExpected.includes(normalizedSpoken)) {
                            console.log('✅ REVERSE CONTAINS MATCH FOUND!');
                            bestMatch = true;
                            bestScore = Math.max(bestScore, 0.9);
                            matchDetails = `Reverse contains: "${normalizedExpected}" contains "${normalizedSpoken}"`;
                        }
                        
                        // 4. Similarity match (for small variations)
                        const similarity = this.calculateSimilarity(normalizedSpoken, normalizedExpected);
                        console.log('  📊 Similarity score:', similarity.toFixed(3));
                        if (similarity > 0.65) { // More lenient threshold
                            bestMatch = true;
                            bestScore = Math.max(bestScore, similarity);
                            matchDetails = `Similarity match: ${similarity.toFixed(3)} between "${normalizedSpoken}" and "${normalizedExpected}"`;
                        }
                    }
                    
                    if (bestScore >= 0.95) {
                        console.log('🎯 Excellent match found, stopping search');
                        break; // Stop if we found an excellent match
                    }
                }
                
                console.log('📊 Final result - Best match:', bestMatch, 'Best score:', bestScore.toFixed(3));
                console.log('📋 Match details:', matchDetails);
                
                // More lenient acceptance threshold
                if (bestMatch && bestScore > 0.65) {
                    console.log('🎉 ANSWER ACCEPTED!');
                    this.handleCorrectAnswer();
                } else {
                    console.log('❌ ANSWER REJECTED');
                    this.handleIncorrectAnswer(alternatives[0].transcript);
                }
            }

            normalizeString(str) {
                return str
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '') // Remove diacritics
                    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"]/g, "") // Remove punctuation
                    .replace(/\s+/g, " ") // Replace multiple spaces with single space
                    .trim();
            }

            calculateSimilarity(str1, str2) {
                const a = str1.toLowerCase();
                const b = str2.toLowerCase();
                
                if (a === b) return 1;
                if (a.length === 0 || b.length === 0) return 0;
                
                const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
                
                for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
                for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
                
                for (let j = 1; j <= b.length; j++) {
                    for (let i = 1; i <= a.length; i++) {
                        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                        matrix[j][i] = Math.min(
                            matrix[j][i - 1] + 1,
                            matrix[j - 1][i] + 1,
                            matrix[j - 1][i - 1] + cost
                        );
                    }
                }
                
                return 1 - (matrix[b.length][a.length] / Math.max(a.length, b.length));
            }

            handleCorrectAnswer() {
                console.log('🎉 HANDLING CORRECT ANSWER');
                
                const responseTime = Date.now() - this.state.problemStartTime;
                
                this.state.correctAnswers++;
                this.state.streak++;
                this.state.totalQuestions++;
                
                const points = 10 + Math.min(this.state.streak * 2, 20);
                this.state.score += points;
                
                if (this.state.streak > this.state.bestStreak) {
                    this.state.bestStreak = this.state.streak;
                }
                
                // Visual feedback - handle both syllables and full words
                const wordElements = document.querySelectorAll('.syllable, .full-word');
                wordElements.forEach(element => element.classList.add('correct'));
                
                // Show clear success feedback
                this.showFeedback(`🎉 PARFAIT! +${points} points! 🌟`, 'success', 3000);
                this.triggerHapticFeedback();
                
                if (this.state.streak >= 3 && this.state.streak % 3 === 0) {
                    this.showConfetti();
                }
                
                this.updateStats();
                
                // Longer delay before auto-advancing to let user see the success
                setTimeout(() => {
                    console.log('⏰ Auto-advancing to next word after correct answer');
                    // Clear the correct styling before moving on
                    wordElements.forEach(element => element.classList.remove('correct'));
                    this.nextWord();
                }, 2500); // Increased from 1500ms to 2500ms
            }

            handleIncorrectAnswer(spokenText = '') {
                console.log('❌ HANDLING INCORRECT ANSWER');
                
                this.state.streak = 0;
                this.state.totalQuestions++;
                
                const currentWord = this.getCurrentWord();
                let message;
                
                if (spokenText && spokenText.trim()) {
                    message = `😊 J'ai entendu "${spokenText}"\nLe mot est "${currentWord?.word}". Essayez encore!`;
                } else {
                    message = `😊 Essayez encore!\nLe mot est "${currentWord?.word}".`;
                }
                
                this.showFeedback(message, 'error', 4000);
                
                // Speak the correct word after a delay
                setTimeout(() => {
                    console.log('🔊 Speaking correct word after incorrect answer');
                    this.speakCurrentWord();
                }, 1500);
                
                this.updateStats();
            }

            nextWord() {
                this.state.sessionQuestions++;
                this.state.currentIndex++;
                
                if (this.state.mode === 'custom') {
                    if (this.state.currentIndex >= this.customWords.length) {
                        this.state.currentIndex = 0; // Loop in custom mode
                    }
                } else {
                    if (this.state.currentIndex >= this.levels[this.state.currentLevel].length) {
                        if (this.state.currentLevel < Object.keys(this.levels).length) {
                            this.state.currentLevel++;
                            this.state.currentIndex = 0;
                            this.elements.level.textContent = this.state.currentLevel;
                            this.showFeedback("🌟 Niveau suivant!", 'info');
                        } else {
                            this.endSession();
                            return;
                        }
                    }
                }
                
                this.updateProgress();
                this.displayCurrentWord();
            }

            endSession() {
                this.saveStats();
                this.showFeedback('🏆 Session terminée! Excellent travail!', 'success');
                this.showConfetti(50);
            }

            resetProgress() {
                this.state.currentLevel = 1;
                this.state.currentIndex = 0;
                this.state.sessionQuestions = 0;
                this.state.score = 0;
                this.state.streak = 0;
                this.state.totalQuestions = 0;
                this.state.correctAnswers = 0;
                
                this.elements.level.textContent = this.state.currentLevel;
                this.updateStats();
                this.updateProgress();
                this.displayCurrentWord();
                this.startSessionTimer();
            }

            showConfetti(count = this.CONFIG.CONFETTI_COUNT) {
                this.elements.confettiContainer.innerHTML = '';
                
                for (let i = 0; i < count; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                    const hue = Math.random() * 360;
                    confetti.style.backgroundColor = `hsl(${hue}, 90%, 65%)`;
                    if (i % 3 === 0) confetti.style.borderRadius = '50%';
                    if (i % 4 === 0) { 
                        confetti.style.width = '4px'; 
                        confetti.style.height = '12px'; 
                    }
                    this.elements.confettiContainer.appendChild(confetti);
                }
                
                setTimeout(() => {
                    this.elements.confettiContainer.innerHTML = '';
                }, 3500);
            }

            showFeedback(message, type = 'info', duration = this.CONFIG.FEEDBACK_DURATION) {
                clearTimeout(this.timers.feedback);
                this.elements.feedback.textContent = message;
                this.elements.feedback.className = `feedback-display visible ${type}`;
                this.timers.feedback = setTimeout(() => this.clearFeedback(), duration);
            }

            clearFeedback() {
                this.elements.feedback.classList.remove('visible');
                setTimeout(() => {
                    if (!this.elements.feedback.classList.contains('visible')) {
                        this.elements.feedback.textContent = '';
                        this.elements.feedback.className = 'feedback-display';
                    }
                }, 200);
            }

            updateStats() {
                this.elements.score.textContent = this.state.score;
                this.elements.streak.textContent = this.state.streak;
                const accuracy = this.state.totalQuestions > 0 
                    ? Math.round((this.state.correctAnswers / this.state.totalQuestions) * 100) 
                    : 100;
                this.elements.accuracy.textContent = `${accuracy}%`;
            }

            updateProgress() {
                if (this.state.mode === 'custom') {
                    // In custom mode, show progress through custom words
                    const progress = this.customWords.length > 0 
                        ? (this.state.currentIndex / this.customWords.length) * 100 
                        : 0;
                    this.elements.progressBar.style.width = `${progress}%`;
                } else {
                    // In levels mode, show progress through current level
                    const progress = this.levels[this.state.currentLevel] 
                        ? (this.state.currentIndex / this.levels[this.state.currentLevel].length) * 100 
                        : 0;
                    this.elements.progressBar.style.width = `${progress}%`;
                }
            }

            startSessionTimer() {
                if (this.timers.session) clearInterval(this.timers.session);
                this.state.sessionStartTime = Date.now();
                this.elements.timer.textContent = '0:00';
                
                this.timers.session = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.state.sessionStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    this.elements.timer.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }

            saveStats() {
                localStorage.setItem('frenchApp_stats', JSON.stringify({
                    bestStreak: this.state.bestStreak,
                    totalScore: this.state.score
                }));
            }

            triggerHapticFeedback() {
                if ('vibrate' in navigator) {
                    try {
                        navigator.vibrate([20, 50, 20]);
                    } catch (e) {
                        // Ignore vibration errors
                    }
                }
            }

            handleKeyboardShortcuts(e) {
                if (e.target.tagName === 'INPUT') return;
                
                if (e.key === ' ' && this.recognition) {
                    e.preventDefault();
                    if (this.state.isListening) {
                        this.stopListening();
                    } else {
                        this.startListening();
                    }
                } else if (e.key === 'Enter') {
                    this.nextWord();
                } else if (e.key.toLowerCase() === 'l') {
                    this.speakCurrentWord();
                }
            }
        }

        // Global functions for inline event handlers
        function addCustomWord() {
            window.app.addCustomWord();
        }

        function speakCurrentWord() {
            window.app.speakCurrentWord();
        }

        function nextWord() {
            window.app.nextWord();
        }

        function resetProgress() {
            window.app.resetProgress();
        }

        // Initialize app when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.app = new FrenchLearningApp();
            });
        } else {
            window.app = new FrenchLearningApp();
        }
    </script>
